[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touch-grass"
version = "0.1.0"
description = "Antidoom, but for agents: native d1 decisions about when to stop digging."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
model = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.19.0",
  "pillow>=12",
]
train = [
  "touch-grass[model]",
  "trl==1.15.0",
  "peft==0.21.2",
  "datasets>=4.3,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
touch-grass = "touch_grass.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires downloaded d1 weights and model dependencies"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
